name: Nibbles PBC
description: >-
  Nibbles PBC is a public benefit company building consumer financial and
  insurance products that make pet ownership easier. Its flagship product is the
  Nibbles credit card, a Mastercard that bundles built-in pet insurance and pet-
  focused rewards for cardholders. The company operates a consumer web
  application and account portal at nibbles.com (formerly reached via the
  nibbl.es short domain) covering sign-up, sign-in, card management, insurance
  policies, and rewards. Nibbles PBC was surfaced as a portfolio company of 500
  Global and added to the API Evangelist network. As of this enrichment pass the
  company publishes no developer API, SDK, OpenAPI specification, or developer
  portal; its public surface is a consumer product site, help center, and legal
  agreements. This profile therefore captures verified company identity and
  domain-security posture only.
